name: golden-dome-soc

x-logging: &default-logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: goldendome-gateway
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks: [goldendome]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goldendome-frontend
    networks: [goldendome]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: goldendome-migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-goldendome}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-goldendome}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks: [goldendome]
    restart: "no"
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: goldendome-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-goldendome}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-goldendome}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      WAZUH_API_URL: ${WAZUH_API_URL:-https://wazuh-manager:55000}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-https://wazuh-indexer:9200}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks: [goldendome]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 5
    logging: *default-logging

  db:
    image: postgres:16-alpine
    container_name: goldendome-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goldendome}
      POSTGRES_USER: ${POSTGRES_USER:-goldendome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [goldendome]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    container_name: goldendome-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks: [goldendome]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    logging: *default-logging

  ollama:
    image: ollama/ollama:0.6.2
    container_name: goldendome-ollama
    volumes:
      - ollama_data:/root/.ollama
    networks: [goldendome]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "ollama list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5
    logging: *default-logging

  ollama-init:
    image: ollama/ollama:0.6.2
    container_name: goldendome-ollama-init
    profiles: [ai-init]
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
    depends_on:
      ollama:
        condition: service_started
    networks: [goldendome]
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull $$OLLAMA_MODEL"]
    logging: *default-logging

  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.1
    container_name: goldendome-wazuh-manager
    profiles: [wazuh]
    environment:
      INDEXER_URL: https://wazuh-indexer:9200
      INDEXER_USERNAME: ${WAZUH_INDEXER_USERNAME:-admin}
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-change-me}
    networks: [goldendome]
    restart: unless-stopped
    logging: *default-logging

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.14.1
    container_name: goldendome-wazuh-indexer
    profiles: [wazuh]
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
    networks: [goldendome]
    restart: unless-stopped
    logging: *default-logging

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.14.1
    container_name: goldendome-wazuh-dashboard
    profiles: [wazuh]
    environment:
      INDEXER_USERNAME: ${WAZUH_INDEXER_USERNAME:-admin}
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-change-me}
      WAZUH_API_URL: https://wazuh-manager
    depends_on: [wazuh-indexer, wazuh-manager]
    networks: [goldendome]
    restart: unless-stopped
    logging: *default-logging

networks:
  goldendome:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  app_data:
  app_logs:
  wazuh_indexer_data:
