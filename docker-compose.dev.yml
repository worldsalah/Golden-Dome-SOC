name: golden-dome-soc-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goldendome}
      POSTGRES_USER: ${POSTGRES_USER:-goldendome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goldendome-dev-password}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-goldendome-dev-redis}"]
    ports: ["6379:6379"]
    volumes: [redis_data:/data]

  ollama:
    image: ollama/ollama:0.6.2
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: .env
    environment:
      DEBUG: "true"
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-goldendome}:${POSTGRES_PASSWORD:-goldendome-dev-password}@db:5432/${POSTGRES_DB:-goldendome}
      REDIS_URL: redis://:${REDIS_PASSWORD:-goldendome-dev-redis}@redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
    depends_on:
      db: {condition: service_healthy}

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  frontend_node_modules:
