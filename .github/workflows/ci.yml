name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: goldendome
          POSTGRES_USER: goldendome
          POSTGRES_PASSWORD: test-password
        options: >-
          --health-cmd "pg_isready -U goldendome -d goldendome"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://goldendome:test-password@localhost:5432/goldendome
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret
      ADMIN_PASSWORD: ci-password
      SEED_DEMO_DATA: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: black --check app tests
      - run: isort --check-only app tests
      - run: mypy app
      - run: bandit -q -r app
      - run: pip-audit -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create CI environment
        run: cp .env.development .env
      - name: Validate compose model
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build gateway frontend backend migrate
      - name: Start core platform
        run: docker compose up -d db redis ollama migrate backend frontend gateway
      - name: Verify services
        run: ./scripts/verify.sh
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color
