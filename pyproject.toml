[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["backend/alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
